# nginx site for the grocery store API on the VPS.
#   sudo cp deploy/nginx-grocery-store-api.conf /etc/nginx/sites-available/grocery-store-api
#   sudo ln -s /etc/nginx/sites-available/grocery-store-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grocerystore.duckdns.org     # adds HTTPS and renews it by itself
# Replace grocerystore.duckdns.org with your own name (DuckDNS is free).
server {
    listen 80;
    server_name grocerystore.duckdns.org;

    # Product photos are up to 3 MB.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
