# Grocery store API site for the nginx container on the VPS. That container
# reads one file, /root/nginx.conf, so these blocks go at the end of it
# (steps in the README, "nginx and HTTPS").
server {
    listen 80;
    server_name grocerystorewebapp.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grocerystorewebapp.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/grocerystorewebapp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grocerystorewebapp.duckdns.org/privkey.pem;

    # Product photos are up to 3 MB.
    client_max_body_size 4m;

    # Look the API container up by name on every request (Docker's DNS), so a
    # deploy that recreates it never leaves nginx pointing at an old address,
    # and nginx still starts while the API container is missing.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $grocery_store_api http://grocery-store-backend:3000;
        proxy_pass $grocery_store_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
