<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery Store UI Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --page-bg: #eceae3; --page-fg: #1b1f1a; --page-muted: #5f6b62; --page-line: #d9d6cb; --page-surface: #fbfaf6; --bezel: #1d211e;
  --green: #1e6b45; --green-deep: #163f2a; --green-hover: #185a3a; --green-light: #e8f3ec; --green-text: #17583a;
  --yellow: #f4c95d; --cream: #fbefd2; --app-bg: #f7f6f1; --card: #ffffff; --text: #1b1f1a; --muted: #66706a; --faint: #8b938d;
  --line: #e7e5de; --line-soft: #efede7; --badge: #c2410c; --error: #9b1c12; --error-light: #fbe9e6; --amber-text: #7a4d00; --blue-text: #2a4f7c;
  --shadow-xs: 0 1px 2px rgba(20, 30, 24, 0.05);
  --shadow-sm: 0 1px 2px rgba(20, 30, 24, 0.04), 0 2px 8px rgba(20, 30, 24, 0.05);
  --font: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #121612; --page-fg: #e9ece6; --page-muted: #9aa69d; --page-line: #2c332d; --page-surface: #1a1f1b; --bezel: #050605; color-scheme: dark; } }
:root[data-theme="dark"] { --page-bg: #121612; --page-fg: #e9ece6; --page-muted: #9aa69d; --page-line: #2c332d; --page-surface: #1a1f1b; --bezel: #050605; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-fg); font-family: var(--font); padding-inline: 16px; padding-block: 32px 64px; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
b, strong, th { font-weight: 600; }
.sheet { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
.sheet-head { display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.sheet-head h1 { font-size: 20px; font-weight: 600; }
.sheet-head p, .row-head p { color: var(--page-muted); font-size: 14px; line-height: 1.55; }
.row-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 80ch; }
.row-head h2 { font-size: 15px; font-weight: 600; }
figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
figcaption { font-size: 13px; color: var(--page-muted); }
figcaption b { color: var(--page-fg); font-weight: 600; margin-right: 6px; }
.tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; margin-right: 8px; vertical-align: 1px; }
.tag-now { background: var(--page-line); color: var(--page-muted); }
.tag-new { background: var(--yellow); color: var(--green-deep); }
.now-shot { width: 100%; border-radius: 12px; border: 1px solid var(--page-line); display: block; }

.frame-wrap { overflow-x: auto; padding-bottom: 6px; }
.frame { min-width: 1240px; border-radius: 14px; background: var(--bezel); padding: 0 8px 8px; box-shadow: 0 24px 48px -20px rgba(0,0,0,.35); }
.frame-bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 6px; }
.frame-bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a403b; }
.frame-bar span { margin-left: 14px; font-size: 11px; color: #8c958e; background: #2a2f2b; border-radius: 6px; padding: 3px 12px; }

/* ── App ── */
.app { display: flex; min-height: 660px; border-radius: 8px; overflow: hidden; background: var(--app-bg); color: var(--text); font-size: 13px; line-height: 1.45; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i-sm { width: 15px; height: 15px; }
.side { width: 224px; flex: none; background: var(--green-deep); color: #c3d9cb; padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #fff; font-size: 15px; font-weight: 600; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.group { display: flex; flex-direction: column; gap: 1px; }
.group p { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7ea08b; padding: 0 10px 6px; }
.nav { height: 34px; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13px; font-weight: 500; }
.nav .i { width: 17px; height: 17px; color: #8db29b; }
.nav.on { background: rgba(255,255,255,.09); color: #fff; font-weight: 600; }
.nav.on .i { color: var(--yellow); }
.nav .n { margin-left: auto; background: var(--yellow); color: var(--green-deep); font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; }
.alerts { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 12.5px; }
.switch { margin-left: auto; width: 30px; height: 18px; border-radius: 999px; background: var(--yellow); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--green-deep); }
.who { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 12.5px; }
.who .av { width: 28px; height: 28px; border-radius: 50%; background: var(--yellow); color: var(--green-deep); font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
.who b { display: block; color: #fff; font-weight: 600; }
.who small { color: #7ea08b; font-size: 11.5px; }
.main { flex: 1; min-width: 0; padding: 24px 28px 32px; display: flex; flex-direction: column; gap: 16px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.page-head h3 { font-size: 20px; font-weight: 600; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.page-head p b { color: var(--text); font-weight: 600; }
.actions { display: flex; gap: 8px; }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
.btn-secondary .i { color: var(--muted); }
.btn-primary { background: var(--green); color: #fff; box-shadow: var(--shadow-xs); }
.btn-small { height: 30px; padding: 0 10px; font-size: 12.5px; }

.toolbar { display: flex; align-items: center; gap: 8px; }
.control { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-xs); color: var(--muted); font-size: 13px; white-space: nowrap; }
.control b { color: var(--text); font-weight: 500; }
.control .chev { width: 14px; height: 14px; color: var(--faint); }
.search { flex: 0 1 300px; min-width: 200px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-xs); color: var(--faint); font-size: 13px; }
.spacer { flex: 1; }

/* ── Orders board ── */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.lane { background: #f0eee8; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.lane-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; font-size: 13px; font-weight: 600; }
.lane-head i { width: 7px; height: 7px; border-radius: 50%; }
.lane-head span { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
.lane.new .lane-head span { color: var(--green-deep); background: var(--yellow); border-radius: 999px; padding: 0 7px; line-height: 18px; font-weight: 600; }
.lane-empty { padding: 18px 10px; text-align: center; color: var(--faint); font-size: 12px; border: 1px dashed #d9d6cc; border-radius: 10px; }
.order { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: var(--shadow-xs); display: flex; flex-direction: column; gap: 10px; }
.order-top { display: flex; align-items: center; justify-content: space-between; }
.order-top strong { font-size: 13px; font-weight: 600; }
.order-top small { color: var(--faint); font-size: 12px; }
.paid { font-size: 11px; font-weight: 600; color: var(--green-text); background: var(--green-light); border-radius: 999px; padding: 1px 8px; }
.place small { display: block; font-size: 12px; color: var(--muted); }
.place b { display: block; font-size: 13.5px; font-weight: 600; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta b { font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.order-actions { display: flex; gap: 6px; padding-top: 2px; }
.order-actions .btn-primary { flex: 1; }
.square { width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.square .i { width: 16px; height: 16px; }
.details { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 8px; }
.order.done { background: #fcfbf8; }
.foot-note { font-size: 12.5px; color: var(--muted); }
.foot-note a { color: var(--green-text); font-weight: 500; margin-left: 4px; }

/* ── Products table ── */
.table-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-xs); overflow: hidden; }
.table-scroll { overflow: auto; }
/* Fit the screen: the table takes the height left under the toolbar and scrolls inside;
   the page buttons sit at the bottom edge. */
.app.fit-screen { height: 800px; }
.fit-screen .side { overflow-y: auto; }
.fit-screen .main { min-height: 0; }
.fit-screen .table-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.fit-screen .table-scroll { flex: 1; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 1; background: #faf9f6; text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: #fbfaf7; }
.num { text-align: right; }
.product { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.product img { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; padding: 4px; background: #f7f2e3; border: 1px solid #f0e9d4; }
.product b { display: block; font-weight: 500; font-size: 13px; }
.product small { color: var(--muted); font-size: 12px; }
.cat { font-size: 12px; color: var(--muted); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack > span { line-height: 20px; }
.num .stack { align-items: flex-end; }
.mrp { color: var(--faint); text-decoration: line-through; }
.price { font-weight: 600; }
.pill { font-size: 11px; font-weight: 500; border-radius: 999px; padding: 0 8px; line-height: 20px; display: inline-block; }
.pill-low { background: var(--cream); color: var(--amber-text); }
.pill-out { background: var(--error-light); color: var(--error); }
.status { font-size: 12px; color: var(--green-text); display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #2fa36b; }
.edit { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.edit:hover { background: #f2f1ec; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pager b { color: var(--text); font-weight: 500; }
.pager-right { display: flex; align-items: center; gap: 16px; }
.per-page { display: inline-flex; align-items: center; gap: 8px; }
.per-page span { height: 28px; padding: 0 6px 0 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--text); display: inline-flex; align-items: center; gap: 2px; }
.pages { display: flex; gap: 2px; }
.pages span { min-width: 28px; height: 28px; padding: 0 6px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--text); font-weight: 500; }
.pages span.on { background: var(--green); color: #fff; }
.pages span.off { color: #c4c7c0; }

/* ── Zones & slots ── */
.zones { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-xs); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.panel-head h4 { margin: 0; font-size: 14px; font-weight: 600; }
.panel-head h4 span { color: var(--muted); font-weight: 500; margin-left: 4px; }
.panel-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.segmented { display: flex; gap: 2px; background: #f2f1ec; border-radius: 8px; padding: 2px; margin: 12px 12px 4px; }
.segmented span { flex: 1; text-align: center; height: 28px; line-height: 28px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.segmented span.on { background: var(--card); color: var(--text); box-shadow: var(--shadow-xs); }
.zone-list { list-style: none; margin: 0; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.zone-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; }
.zone-item:hover { background: #f7f6f2; }
.zone-item.on { background: var(--green-light); }
.zone-icon { width: 32px; height: 32px; flex: none; border-radius: 8px; background: #e9f0f9; color: var(--blue-text); display: inline-flex; align-items: center; justify-content: center; }
.zone-icon.local { background: #f4efe2; color: var(--amber-text); }
.zone-text { flex: 1; min-width: 0; }
.zone-text b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone-text small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #2fa36b; flex: none; }
.zone-title { display: flex; align-items: center; gap: 8px; }
.zone-title h4 { margin: 0; font-size: 14px; font-weight: 600; }
.chip-tag { font-size: 11px; font-weight: 500; border-radius: 999px; padding: 0 8px; line-height: 20px; background: #e9f0f9; color: var(--blue-text); }
.chip-live { background: var(--green-light); color: var(--green-text); }
.section-label { font-size: 12px; font-weight: 600; color: var(--text); margin: 0 0 8px; }
.section-note { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 760px; }
.form-grid .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.input { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); box-shadow: var(--shadow-xs); font-size: 13px; color: var(--text); }
.input .prefix { color: var(--faint); }
.input.placeholder { color: var(--faint); }
.divider { height: 1px; background: var(--line-soft); margin: 0 -16px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 760px; }
.switch-row b { display: block; font-size: 13px; font-weight: 500; }
.switch-row small { color: var(--muted); font-size: 12px; }
.toggle { width: 34px; height: 20px; border-radius: 999px; background: var(--green); position: relative; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.towers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tower { height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--card); }
.tower .i { width: 13px; height: 13px; color: var(--faint); }
.tower-add { display: inline-flex; gap: 6px; }
.tower-add .input { width: 150px; height: 28px; border-radius: 999px; }
.tower-add .btn { height: 28px; border-radius: 999px; }
.days { display: inline-flex; gap: 3px; }
.days span { width: 20px; height: 20px; border-radius: 50%; font-size: 10.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; background: var(--green-light); color: var(--green-text); }
.days span.off { background: #f0efe9; color: #b6bab3; }
.tip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--line-soft); }
.tip .i { color: #b8740f; }
.save-bar { display: flex; justify-content: flex-end; gap: 8px; }
/* Many zones: the zone list and the editor each scroll on their own,
   so the list never pushes the editor down and the page height stays the screen height. */
.zone-column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.zone-panel { display: flex; flex-direction: column; }
.zone-panel .search { flex: none; min-width: 0; margin: 12px 12px 0; }
.fit-screen .zones { flex: 1; min-height: 0; align-items: stretch; }
.fit-screen .zone-panel { min-height: 0; }
.fit-screen .zone-list { flex: 1; min-height: 0; overflow-y: auto; }
.fit-screen .zone-column { min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
.live-dot.off { background: #c9ccc5; }
.status.off { color: var(--muted); }
.status.off::before { background: #c9ccc5; }
.slot-table th, .slot-table td { padding-left: 12px; padding-right: 12px; }
.slot-table td { white-space: nowrap; }
.slot-table td:last-child { width: 1%; }
.slot-table td small { display: block; white-space: normal; font-size: 12px; color: var(--muted); }
/* ── Scrollbars: thin, soft green; lighter on the dark sidebar.
   Chrome and Safari get a 6px bar; Firefox only allows "thin" (it ignores the -webkit rules). */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: #bccdc2; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #98b3a2; }
.side::-webkit-scrollbar-thumb, .side ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: #bccdc2 transparent; }
  .side, .side * { scrollbar-color: rgba(255, 255, 255, 0.22) transparent; }
}
/* ── Store settings ── */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.input .suffix { margin-left: auto; color: var(--faint); }
.hint-line { font-size: 12px; color: var(--muted); }
.map-box { position: relative; height: 210px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #eef1ea; }
.map-box iframe { width: 100%; height: 100%; border: 0; display: block; }
.map-chip { position: absolute; left: 10px; top: 10px; background: var(--card); border-radius: 999px; padding: 0 10px; line-height: 26px; font-size: 12px; font-weight: 500; box-shadow: var(--shadow-xs); border: 1px solid var(--line); }
.button-line { display: flex; gap: 8px; flex-wrap: wrap; }
.saved-note { font-size: 12px; color: var(--green-text); display: inline-flex; align-items: center; gap: 4px; }

/* ── Dashboard ── */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-xs); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.tile-icon { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--green-light); color: var(--green-text); }
.tile-icon.amber { background: var(--cream); color: var(--amber-text); }
.tile-icon.red { background: var(--error-light); color: var(--error); }
.tile-icon.blue { background: #e9f0f9; color: var(--blue-text); }
.tile strong { font-size: 22px; font-weight: 600; line-height: 1.3; }
.tile small { font-size: 12px; color: var(--muted); }
.tile small.good { color: var(--green-text); }
.tile small.warn { color: var(--badge); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dash-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.chart-total { display: flex; align-items: baseline; gap: 8px; }
.chart-total strong { font-size: 18px; font-weight: 600; }
.chart-total small { font-size: 12px; color: var(--muted); }
.up { color: var(--green-text); font-weight: 500; }
.bars { position: relative; display: flex; align-items: flex-end; gap: 14px; height: 170px; margin: 16px 16px 0; padding-top: 4px;
  background: repeating-linear-gradient(to top, var(--line-soft) 0 1px, transparent 1px 42px); border-bottom: 1px solid var(--line); }
.bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.bar-col b { font-size: 11px; font-weight: 500; color: var(--muted); }
.bar { width: 100%; max-width: 44px; border-radius: 6px 6px 2px 2px; background: #c9dfd1; }
.bar-col.today .bar { background: var(--green); }
.bar-col.today b { color: var(--text); }
.bar-days { display: flex; gap: 14px; margin: 0 16px; padding: 8px 0 14px; }
.bar-days span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
.bar-days span small { display: block; font-size: 11px; color: var(--faint); }
.split { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; }
.split i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.legend b { color: var(--text); font-weight: 500; }
.zone-bars { display: flex; flex-direction: column; gap: 12px; }
.zone-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; font-size: 12.5px; }
.zone-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zone-bar b { font-weight: 500; }
.zone-bar .track { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: #f0efe9; }
.zone-bar .track i { display: block; height: 100%; border-radius: 999px; background: var(--green); }
.fill { display: flex; align-items: center; gap: 10px; }
.fill .track { flex: 1; height: 6px; border-radius: 999px; background: #f0efe9; min-width: 80px; }
.fill .track i { display: block; height: 100%; border-radius: 999px; background: var(--green); }
.fill .track i.busy { background: #d9902a; }
.slot-table td:first-child small { display: block; font-size: 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0 16px; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.list li:last-child { border-bottom: 0; }
.list li small { color: var(--muted); font-size: 12px; }
.list .rank { display: inline-block; width: 20px; color: var(--faint); font-size: 12px; }
.link { color: var(--green-text); font-size: 12.5px; font-weight: 500; }
/* ── Customers ── */
.filter-tabs { margin: 0; flex: none; }
.filter-tabs span { flex: none; padding: 0 12px; }
.person { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--green-light); color: var(--green-text); font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.two-line b { display: block; font-weight: 500; }
.two-line small { display: block; font-size: 12px; color: var(--muted); }
.phone { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.phone .square { width: 26px; height: 26px; border-radius: 7px; }
.phone .square .i { width: 14px; height: 14px; }
.pill-green { background: var(--green-light); color: var(--green-text); }
.orders-link { color: var(--green-text); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
tr.row-blocked td { background: #fcfbf9; }
tr.row-blocked .two-line b, tr.row-blocked .avatar { opacity: .55; }
tr.row-open td { background: #f8faf7; border-bottom: 0; }
tr.history-row td { background: #f8faf7; padding-top: 0; }
.history { margin-left: 40px; display: flex; flex-direction: column; border-left: 2px solid var(--line); padding-left: 14px; gap: 6px; }
.history span { display: flex; gap: 12px; align-items: center; font-size: 12.5px; }
.history em { font-style: normal; color: var(--muted); min-width: 52px; }
.list-foot { font-size: 12px; color: var(--muted); padding: 9px 16px; border-top: 1px solid var(--line-soft); }
</style></head>
